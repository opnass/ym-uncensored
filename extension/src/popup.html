<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>YM Uncensored</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      width: 400px; margin: 0; padding: 14px 16px 16px;
      font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #14151a; color: #e6e7ea;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #666b7a; flex: none; }
    .dot.on { background: #7ee27e; box-shadow: 0 0 8px #7ee27e66; }
    .switch { margin-left: auto; }
    .card { background: #1c1e26; border: 1px solid #2a2d38; border-radius: 10px; padding: 11px 12px; }
    .card + .card { margin-top: 9px; }
    .track-title { font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
    .track-artist { color: #8b8f9c; font-size: 12px; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: #7c8190; word-break: break-all; }
    .row { display: flex; gap: 7px; align-items: center; }
    .row + .row { margin-top: 8px; }
    select, button {
      font: inherit; border-radius: 7px; border: 1px solid #3a3f4f;
      background: #2b2f3c; color: #e6e7ea; padding: 6px 9px; cursor: pointer;
    }
    select { flex: 1; min-width: 0; }
    button:hover { background: #353a4a; }
    button.primary { background: #ffcc00; border-color: #ffcc00; color: #1a1a1a; font-weight: 600; }
    button.primary:hover { background: #ffd633; }
    button.ghost { background: transparent; }
    button:disabled { opacity: .4; cursor: default; }
    .status { font-size: 12px; padding: 7px 9px; border-radius: 8px; margin-top: 9px; }
    .status.ok { background: #1e2a1c; color: #9ad48f; }
    .status.warn { background: #2a2418; color: #e8c47a; }
    .status.bad { background: #2a1a1a; color: #ff9a9a; }
    .hint { color: #6d7280; font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #8b8f9c; margin: 16px 0 7px; }
    .diag { max-height: 210px; overflow-y: auto; }
    .step { display: flex; gap: 7px; padding: 4px 0; border-bottom: 1px solid #23262f; font-size: 11.5px; }
    .step:last-child { border-bottom: none; }
    .step .mark { flex: none; width: 12px; font-weight: 700; }
    .step .mark.ok { color: #7ee27e; }
    .step .mark.bad { color: #ff8f8f; }
    .step .body { min-width: 0; }
    .step .stage { color: #cdd2de; }
    .step .detail { color: #7c8190; font-size: 11px; word-break: break-word; }
    .summary { font-size: 12px; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; }
    .summary.ok { background: #1e2a1c; color: #9ad48f; }
    .summary.bad { background: #2a1a1a; color: #ff9a9a; }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>YM Uncensored</h1>
    <label class="switch"><input type="checkbox" id="enabled" title="Включить" /></label>
  </header>

  <div class="card">
    <div class="track-title" id="tTitle">Определяю трек…</div>
    <div class="track-artist" id="tArtist"></div>
    <div class="mono" id="tKey"></div>
  </div>

  <div class="card">
    <div class="row">
      <select id="fileSel"><option value="">— файл из библиотеки —</option></select>
    </div>
    <div class="row">
      <button class="primary" id="bindBtn" style="flex:1">Привязать к текущему треку</button>
      <button class="ghost" id="unbindBtn" title="Снять привязку">✕</button>
    </div>
    <div class="hint" id="bindHint"></div>
  </div>

  <div class="card">
    <div class="row">
      <button id="openOpts" style="flex:1">Библиотека и настройки</button>
      <button class="ghost" id="refreshDiag" title="Обновить">↻</button>
    </div>
  </div>

  <div id="status"></div>

  <h2>Диагностика — где рвётся</h2>
  <div class="card diag" id="diagBox">
    <div class="hint">Включи трек в плеере, потом нажми ↻.</div>
  </div>

  <script src="normalize.js"></script>
  <script src="db.js"></script>
  <script src="popup.js"></script>
</body>
</html>
