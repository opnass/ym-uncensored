name: YM Companion (Android)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Тесты сопоставления
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Сборка APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Имя файла
        run: cp app/build/outputs/apk/debug/app-debug.apk "ym-companion-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ym-companion-${{ github.run_number }}
          path: android/ym-companion-${{ github.run_number }}.apk

      # тестовая сборка — в пре-релиз, чтобы скачать APK прямо на телефон без входа в GitHub
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: companion-dev
          name: YM Companion — тестовая сборка
          prerelease: true
          files: android/ym-companion-${{ github.run_number }}.apk
          body: |
            Тестовая сборка компаньона для Android. Каждая новая сборка добавляет сюда APK с бо́льшим номером — ставь самый свежий поверх старого.
            Установка и настройка — в android/README.md.
